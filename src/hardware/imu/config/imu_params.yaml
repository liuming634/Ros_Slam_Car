# ============================================================
# imu_node 参数
# ============================================================
imu_node:
  ros__parameters:
    # 数据源：sim=模拟（无硬件联调用），serial=真串口 IMU（驱动待实现）
    imu_source: "sim"

    # 输出坐标系（与 urdf/vi_car.urdf 的 imu_link 保持一致）
    frame_id: "imu_link"

    # 发布频率
    publish_rate: 50

    # 串口模式参数（接入 MPU6050/BNO085 等真 IMU 时配置）
    serial_port: "/dev/ttyUSB1"
    baud_rate: 115200
