# camera_node 参数配置
# 与 src/drivers/camera/src/camera_node.cpp 中 declare_parameter 保持一一对应
# 节点名前缀与 launch/camera_launch.py 及 launch/include/hardware_sensors.launch.py 中的 name='camera_node' 一致
camera_node:
  ros__parameters:
    # 相机来源：usb = 普通 UVC 摄像头（FPV 图传接收端即为此）；fpv = 未实现（占位）
    camera_source: usb
    # USB 相机参数
    camera_id: 0
    # 分辨率与 config/cam0_pinhole.yaml 标定一致
    camera_width: 640
    camera_height: 480
    camera_fps: 30
    camera_hflip: false
    camera_vflip: false
    # 畸变校正文件（未启用，预留）
    camera_matrix_file: calibration_data/camera_matrix.npy
    dist_coeffs_file: calibration_data/dist_coeffs.npy
    # FPV 参数（接收端走 USB 时不生效，预留）
    fpv_key: gs.key
    fpv_channel: 161
    fpv_channel_width: 20
    fpv_codec: h265
    fpv_width: 1920
    fpv_height: 1080
    fpv_fps: 60
